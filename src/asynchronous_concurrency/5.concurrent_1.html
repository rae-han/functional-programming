<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script type="module">
      // fxjs.js에서 필요한 함수들을 import
      import { add, C, go, L } from '/src/fxjs.js';

      // delay1000 함수 정의
      const delay1000 = (a) =>
        new Promise((resolve) =>
          setTimeout(() => {
            console.log('hi! concurrent.');
            resolve(a);
          }, 500),
        );

      console.time('time4');
      go(
        [1, 2, 3, 4, 5, 6, 7, 8, 9],
        L.map((a) => delay1000(a * a)),
        L.filter((a) => delay1000(a % 2)),
        L.map((a) => delay1000(a * a)),
        C.reduce(add),
        console.log,
        (_) => console.timeEnd('time4'),
      );
    </script>
  </body>
</html>
